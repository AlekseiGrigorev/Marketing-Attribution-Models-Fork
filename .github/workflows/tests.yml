name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        # Promote pandas/numpy deprecations to errors so upcoming breaking
        # changes cannot pass CI unnoticed.
        run: pytest -W error::FutureWarning -W error::DeprecationWarning
